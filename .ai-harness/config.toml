[harness]
name = "adaptive-ai-coding-harness"
version = 10
default_provider = "claude"
auto_route = true
learn_after_run = true
auto_groom = true
checkpoint_long_runs = true
require_verification_before_complete = true

[runtime]
mode = "single-adaptive-run"
looping_enabled = false
recursive_self_invocation = false
user_requested_loop_only = true

[router]
route_budget = 900
memory_budget = 900
context_budget = 3200
max_history_chars = 4000
minimum_confidence_for_auto_capability = 0.68
escalate_after_failed_verifications = 2

[orchestration]
mode = "adaptive-single-run"
user_requested_loop = false
max_autonomous_repair_attempts = 2
policy_file = ".ai-harness/ORCHESTRATION_SPEC.md"

[model_routing]
default_tier = "standard"
low = { reasoning = "low", purpose = "classification, summarization, simple edits" }
standard = { reasoning = "medium", purpose = "normal implementation and debugging" }
high = { reasoning = "high", purpose = "architecture, difficult debugging, risky changes" }
critical = { reasoning = "xhigh", purpose = "hardest long-horizon or high-risk tasks" }
auto_escalate = true
escalate_on_risk = ["high", "critical"]
escalate_on_uncertainty = ["unknown"]
escalate_after_failed_verifications = 2

[context]
stable_prefix = true
prefer_repository_map = true
prefer_targeted_reads = true
compress_prior_phase_output = true
preserve_checkpoints = true
policy_file = ".ai-harness/CONTEXT_POLICY.md"

[flash_context]
enabled = true
policy_file = ".ai-harness/FLASH_CONTEXT_POLICY.md"
strategy = "stable-prefix + tiled-context + relevance-ranking + bounded-evidence"
budget_chars = 12000
repository_budget_chars = 9000
memory_budget_chars = 2000
history_budget_chars = 2400
preserve_verification_evidence = true
third_party_dependency = false

[execution]
max_phase_retries = 1
phase_timeout_seconds = 1200
provider_timeout_seconds = 900
validation_timeout_seconds = 600
require_new_evidence_for_retry = true
inspect_diff_before_complete = true
run_native_validation = true
auto_discover_validation = true
repair_on_verification_failure = true
repair_on_review_failure = true
max_repair_attempts = 2
policy_file = ".ai-harness/EXECUTION_POLICY.md"

[verification]
policy_file = ".ai-harness/VERIFICATION_POLICY.md"
require_acceptance_evidence = true
require_diff_check = true
require_review_for_high_risk = true

[observability]
log_level = "INFO"
local_telemetry = true
telemetry_file = "telemetry.jsonl"
external_export = false

[worktrees]
enabled = true
auto_for_risk = ["high", "critical"]
auto_for_parallel_reviews = true
base = "HEAD"
root = ".ai-harness/worktrees"
keep_on_failure = true
remove_after_success = false
require_clean_before_merge = true

[reviewers]
enabled = true
default = ["correctness"]
on_high_risk = ["correctness", "security", "architecture"]
parallel = true
read_only = true
timeout_seconds = 900
require_consensus_for_high_risk = false
policy_file = ".ai-harness/REVIEW_POLICY.md"

[delegation]
enabled = true
parallelize_only_independent_work = true
never_parallel_edit_same_file = true
use_worktrees_for_mutating_agents = true

[learning]
min_observations_for_promotion = 3
min_success_rate_for_promotion = 0.75
stale_after_days = 120
max_memory_items = 250
record_route_metrics = true
record_verification_metrics = true
record_token_metrics_when_available = true
record_reviewer_findings = true
policy_file = ".ai-harness/LEARNING_POLICY.md"

default_principles = [
  "DRY",
  "YAGNI",
  "KISS",
  "DI",
  "SOLID",
  "separation-of-concerns",
  "high-cohesion-low-coupling",
  "composition-over-inheritance",
  "least-knowledge",
  "fail-fast",
  "single-source-of-truth",
  "least-surprise",
  "illegal-states-hard-to-represent",
  "compatibility-by-default",
  "behavior-focused-testing",
  "security-by-default",
  "failure-awareness",
  "observability",
  "reversibility",
  "least-privilege",
  "locality-of-change",
  "evidence-over-assumption"
]

[token]
policy_file = ".ai-harness/TOKEN_POLICY.md"
default_budget = 6000
max_budget = 30000
prefer_reuse = true

[architecture]
policy_file = ".ai-harness/ARCHITECTURE_POLICY.md"
placement_required_for_new_files = true

[provider_contract]
policy_file = ".ai-harness/PROVIDER_CONTRACT.md"

[quality]
policy_file = ".ai-harness/QUALITY_GOVERNANCE.md"

[workflow]
default = "adaptive"

[workflows.adaptive]
phases = ["route", "context", "execute", "validate", "review", "learn"]

[workflows.research]
phases = ["route", "context", "research", "learn"]

[workflows.poc]
phases = ["route", "context", "research", "poc", "validate", "learn"]

[workflows.grill]
phases = ["route", "context", "grill", "learn"]

[workflows.review]
phases = ["route", "context", "review", "learn"]

[workflows.debug]
phases = ["route", "context", "debug", "execute", "validate", "review", "learn"]

[providers.claude]
command = ["{python}", ".ai-harness/provider.py", "--prompt-file", "{prompt_file}", "--", "claude", "-p"]
working_directory = "{workspace}"

[providers.codex]
command = ["{python}", ".ai-harness/provider.py", "--prompt-file", "{prompt_file}", "--", "codex", "exec"]
working_directory = "{workspace}"

[providers.gemini]
command = ["{python}", ".ai-harness/provider.py", "--prompt-file", "{prompt_file}", "--", "gemini", "-p"]
working_directory = "{workspace}"

[validation]
commands = []
auto_discover = true

[evals]
enabled = true
cases_file = ".ai-harness/evals/cases.jsonl"
require_promotion_evidence = true

[development_hardening]
review_cycles = 500
execution_enabled = false
purpose = "maintainer-only repository improvement"
policy_file = ".ai-harness/DEVELOPMENT_HARDENING.md"
