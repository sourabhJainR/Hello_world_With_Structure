[harness]
name = "adaptive-ai-coding-orchestrator"
version = 21
default_provider = "claude"
auto_route = true
learn_after_run = true
auto_groom = true
checkpoint_long_runs = true
require_verification_before_complete = true

[loop_engineering]
enabled = true
strategy = "generation + evaluation + memory + scheduling + optimization"
default_risk = "normal"
allow_explicit_bounded_loop = true
max_explicit_iterations = 4
minimum_utility_gain = 0.03
parallel_read_only_subagents = true
provenance_required_for_learning = true
stop_on_diminishing_returns = true

[runtime]
mode = "single-adaptive-run"
looping_enabled = false
recursive_self_invocation = false
user_requested_loop_only = true

[router]
route_budget = 900
memory_budget = 900
context_budget = 3200
max_history_chars = 4000
minimum_confidence_for_auto_capability = 0.68
escalate_after_failed_verifications = 2

[model_routing]
default_tier = "standard"
minimum_viable_model = true
policy = "smallest-safe-model"
low = { reasoning = "low", purpose = "classification, summarization, simple edits" }
standard = { reasoning = "medium", purpose = "normal implementation and debugging" }
high = { reasoning = "high", purpose = "architecture, difficult debugging, risky changes" }
critical = { reasoning = "xhigh", purpose = "hardest long-horizon or high-risk tasks" }
auto_escalate = true
escalate_on_risk = ["high", "critical"]
escalate_on_uncertainty = ["unknown"]
escalate_after_failed_verifications = 2
prefer_efficient_provider_for_token_heavy_work = true

[context]
stable_prefix = true
prefer_repository_map = true
prefer_targeted_reads = true
preprocess_relevance = true
relevance_module = ".ai-harness/runtime/token_optimizer.py"
compress_prior_phase_output = true
preserve_checkpoints = true
policy_file = ".ai-harness/CONTEXT_POLICY.md"

[flash_context]
enabled = true
policy_file = ".ai-harness/FLASH_CONTEXT_POLICY.md"
strategy = "stable-prefix + content-addressed-page-cache + evidence-priority-compaction + tiled-context + relevance-ranking + bounded-evidence"
budget_chars = 12000
repository_budget_chars = 9000
memory_budget_chars = 2000
history_budget_chars = 2400
preserve_verification_evidence = true
third_party_dependency = false

[context_cache]
enabled = true
module = ".ai-harness/runtime/context_cache.py"
page_chars = 1800
content_addressed = true
stable_prefix_reuse = true
provider_side_kv_cache = "adapter-dependent"
require_provider_reported_hits = true

[token]
policy_file = ".ai-harness/TOKEN_POLICY.md"
default_budget = 6000
max_budget = 30000
prefer_reuse = true
preprocess_inputs = true
minimum_viable_model = true
script_first_for_repeatable_tasks = true
record_optimization_metrics = true
route_token_heavy_work = true

[scripts]
enabled = true
policy_file = ".ai-harness/SCRIPT_POLICY.md"
prefer_deterministic_for_repeatable = true
require_audit_record = true

[capability_catalog]
enabled = true
catalog_file = ".ai-harness/runtime/capability_catalog.py"
minimum_capability_set = true
explicit_report_contracts = true
parallel_read_only_only = true

[durability]
enabled = true
journal_file = "execution.journal.jsonl"
hash_chain = true
replay_projection = true
journal_failure_is_non_fatal = false

[orchestration]
max_passes = 10
mandatory_high_risk_passes = [6, 7, 8, 10]
policy_file = ".ai-harness/ORCHESTRATION_SPEC.md"
ten_loop_policy_file = ".ai-harness/TEN_LOOP_POLICY.md"
mode = "adaptive-single-run"
user_requested_loop = false
max_autonomous_repair_attempts = 2

[execution_controls]
enabled = true
checkpoint_after_phase = true
checkpoint_after_chunk = true
context_integrity_check = true
scope_fence = true
allow_automatic_low_risk_continuation = true
require_confirmation_for = ["destructive", "production-external-side-effect", "permission-change", "security-policy-change"]
context_rot_threshold = 0.50
guardrail_loss_threshold = 0.67
max_task_chunks = 8
max_recent_output_chars = 12000
policy_file = ".ai-harness/EXECUTION_CONTROLS.md"

[extensions]
registry = ".ai-harness/extension_registry.toml"
install_optional = false
mutate_external_tools = false
conflict_policy = "repository > security > acceptance > local-architecture > verification > orchestrator > extension > model"

[execution]
max_phase_retries = 1
phase_timeout_seconds = 1200
provider_timeout_seconds = 900
validation_timeout_seconds = 600
require_new_evidence_for_retry = true
inspect_diff_before_complete = true
run_native_validation = true
auto_discover_validation = true
repair_on_verification_failure = true
repair_on_review_failure = true
max_repair_attempts = 2
policy_file = ".ai-harness/EXECUTION_POLICY.md"

[verification]
policy_file = ".ai-harness/VERIFICATION_POLICY.md"
require_acceptance_evidence = true
require_diff_check = true
require_review_for_high_risk = true

[observability]
log_level = "INFO"
local_telemetry = true
telemetry_file = "telemetry.jsonl"
external_export = false

[construct_traceability]
enabled = true
index_module = ".ai-harness/runtime/construct_index.py"
artifact = "construct-index.json"
references_artifact = "construct-references.json"
require_actual_construct_references = true
allow_unresolved_references = false
include_files = true
include_symbols = true
include_sql_objects = true
include_data_keys = true
prompt_budget_chars = 9000

[worktrees]
enabled = true
auto_for_risk = ["high", "critical"]
auto_for_parallel_reviews = true
base = "HEAD"
root = ".ai-harness/worktrees"
keep_on_failure = true
remove_after_success = false
require_clean_before_merge = true

[reviewers]
enabled = true
default = ["correctness"]
on_high_risk = ["correctness", "security", "architecture"]
parallel = true
read_only = true
timeout_seconds = 900
require_consensus_for_high_risk = true
policy_file = ".ai-harness/REVIEW_POLICY.md"

[delegation]
enabled = true
parallelize_only_independent_work = true
never_parallel_edit_same_file = true
use_worktrees_for_mutating_agents = true

[learning]
min_observations_for_promotion = 5
min_success_rate_for_promotion = 0.80
min_lower_bound_for_candidate = 0.70
min_improvement_over_incumbent = 0.03
stale_after_days = 120
max_memory_items = 250
experience_store = ".ai-harness/learning/experience.db"
record_route_metrics = true
record_verification_metrics = true
record_token_metrics_when_available = true
record_reviewer_findings = true
record_reported_regressions = true
regression_events_file = ".ai-harness/learning/regression-events.jsonl"
task_memory_file = ".ai-harness/learning/task-memory.jsonl"
record_failed_commands = true
record_failed_approaches = true
record_unresolved_bugs = true
record_feature_misses = true
auto_shadow = true
auto_canary = true
canary_exposures = [0.05, 0.10, 0.25, 0.50, 1.0]
canary_min_cases_per_stage = 3
canary_min_pass_rate = 1.0
canary_min_verification_rate = 1.0
rollback_acceptance_drop = 0.10
rollback_regression_increase = 0.05
