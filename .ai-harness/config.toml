[workflow]
default = "coding"
review_failure_marker = "HARNESS_FIX_REQUIRED"

# Workflows are selected explicitly. Optional capabilities do not run unless requested.
[workflows.coding]
phases = ["understand", "plan", "implement", "review", "fix"]

[workflows.research]
phases = ["research"]

[workflows.poc]
phases = ["understand", "research", "poc"]

[workflows.grill]
phases = ["grill"]

[workflows.research-coding]
phases = ["research", "understand", "plan", "implement", "review", "fix"]

[providers.claude]
command = ["claude", "-p", "{prompt_file}"]
working_directory = "{workspace}"

[providers.codex]
command = ["codex", "exec", "{prompt_file}"]
working_directory = "{workspace}"

[providers.gemini]
command = ["gemini", "-p", "{prompt_file}"]
working_directory = "{workspace}"

# Add any compatible CLI here. Example:
# [providers.local]
# command = ["my-agent", "--instructions", "{prompt_file}"]
# working_directory = "{workspace}"

[validation]
# Commands are optional and project-specific.
# They run after implementation and after a fix.
commands = []
