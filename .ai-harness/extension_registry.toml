[registry]
version = 1
install_optional = false
mutate_external_tools = false

[extensions.graphify]
kind = "code-intelligence"
commands = ["graphify"]
artifacts = ["graphify-out/graph.json", ".graphify/graph.json"]
capabilities = ["ast", "graph", "impact", "query", "path", "explain"]
policy = "prefer when available and fresh; preserve extracted/inferred provenance"
source = "https://github.com/Graphify-Labs/graphify"
license = "Apache-2.0"

[extensions.code_memory]
kind = "code-intelligence"
commands = ["codebase-memory-mcp"]
artifacts = [".codebase-memory/graph.json"]
capabilities = ["ast", "graph", "semantic-search", "impact", "call-tracing", "architecture"]
policy = "prefer for persistent structural retrieval and impact analysis when available"
source = "https://github.com/SuperCodeAgents/code-memory-mcp"
license = "MIT"

[extensions.superpowers]
kind = "process-skill"
markers = ["~/.config/superpowers/skills", "~/.claude/plugins", ".claude-plugin"]
capabilities = ["brainstorming", "tdd", "systematic-debugging", "planning", "execution", "skill-development"]
policy = "invoke only the specific applicable skill; do not duplicate the full process"
source = "https://github.com/obra/superpowers"
license = "MIT"

[extensions.ponytail]
kind = "behavior-skill"
commands = []
markers = ["~/.claude/skills/ponytail", ".claude/skills/ponytail", ".agents/skills/ponytail"]
capabilities = ["yagni", "minimal-change", "delete-before-add"]
policy = "use as a design constraint; never trade away correctness, security, error handling, accessibility, or acceptance criteria"
source = "https://github.com/DietrichGebert/ponytail"
license = "MIT"

[extensions.caveman]
kind = "context-compression"
commands = ["caveman"]
markers = ["~/.claude/skills/caveman", ".claude/skills/caveman", ".agents/skills/caveman"]
capabilities = ["output-compression", "subagent-compression", "token-efficiency"]
policy = "compress communication only; never lossily compress source, commands, errors, acceptance criteria, or verification evidence"
source = "https://github.com/JuliusBrussee/caveman"
license = "MIT"

[extensions.generic_skill]
kind = "agent-skill"
markers = [".agents/skills", ".claude/skills"]
capabilities = ["task-specific-process"]
policy = "discover by description and invoke only when relevant"

[extensions.mcp]
kind = "tool-provider"
markers = [".mcp.json", "~/.claude.json"]
capabilities = ["external-tools", "external-context"]
policy = "use only approved, trusted, explicitly configured MCP servers"
