name: Publish CI Artifacts
description: Publish CI evidence through the repository-standard artifact policy
inputs:
  artifact-name:
    description: GitHub Actions artifact name
    required: true
  path:
    description: File or directory to publish
    required: true
  retention-days:
    description: Artifact retention period
    required: false
    default: '14'
runs:
  using: composite
  steps:
    - name: Upload CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
