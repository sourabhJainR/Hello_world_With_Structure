name: _Hermes Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [hermes-agent-enhancement-v2]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_portable_aer tests.test_contract_alignment tests.test_hermes_capability_integration -v
