name: Agency quality

on:
  pull_request:
    paths:
      - 'agency/**'
      - 'portable/agency_*.py'
      - 'portable/ai_coding_agency_bridge.py'
      - 'portable/semantic_addressing.py'
      - 'portable/repository_intelligence.py'
      - 'portable/agent_capabilities.py'
      - 'portable/capability_fabric.py'
      - 'portable/persistent_memory.py'
      - 'scripts/sync_agency_agents.py'
      - 'scripts/check_agency_agents.py'
      - 'tests/test_agency_*.py'
      - 'tests/test_ai_coding_agency_bridge.py'
      - 'tests/test_ai_coding_codebase_context.py'
      - 'tests/test_canonical_ownership.py'
      - 'tests/test_semantic_addressing.py'
      - '.agents/skills/agency-*/**'
      - '.agents/skills/ai-coding-orchestrator/SKILL.md'
      - '.ai-harness/AGENCY_AGENT_QUALITY.md'
  push:
    branches: [main]
    paths:
      - 'agency/**'
      - 'portable/agency_*.py'
      - 'portable/ai_coding_agency_bridge.py'
      - 'portable/semantic_addressing.py'
      - 'portable/repository_intelligence.py'
      - 'portable/agent_capabilities.py'
      - 'portable/capability_fabric.py'
      - 'portable/persistent_memory.py'
      - 'scripts/sync_agency_agents.py'
      - 'scripts/check_agency_agents.py'
      - 'tests/test_agency_*.py'
      - 'tests/test_ai_coding_agency_bridge.py'
      - 'tests/test_ai_coding_codebase_context.py'
      - 'tests/test_canonical_ownership.py'
      - 'tests/test_semantic_addressing.py'
      - '.agents/skills/agency-*/**'
      - '.agents/skills/ai-coding-orchestrator/SKILL.md'
      - '.ai-harness/AGENCY_AGENT_QUALITY.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile agency runtime
        run: python -m py_compile portable/agency_*.py portable/ai_coding_agency_bridge.py portable/semantic_addressing.py portable/repository_intelligence.py scripts/sync_agency_agents.py scripts/check_agency_agents.py
      - name: Validate rubric
        run: python -m json.tool agency/AGENCY_QUALITY_RUBRIC.json >/dev/null
      - name: Validate vendored agency snapshot when present
        run: |
          if [ -f agency/registry.json ]; then
            python scripts/check_agency_agents.py
          else
            echo 'No vendored agency snapshot; pinned source manifest remains the contract.'
          fi
      - name: Run agency tests
        run: python -m unittest discover -s tests -p 'test_agency_*.py' -v
      - name: Run AI coding bridge tests
        run: python -m unittest tests/test_ai_coding_agency_bridge.py tests/test_ai_coding_codebase_context.py -v
      - name: Run canonical ownership tests
        run: python -m unittest tests/test_canonical_ownership.py tests/test_semantic_addressing.py -v
      - name: Run v9 planner tests
        run: python -m unittest tests/test_agency_execution_plan.py tests/test_agency_multi_specialist.py -v
      - name: Run v10 adaptive feedback tests
        run: python -m unittest tests/test_agency_adaptive_planning.py -v
      - name: Run v11/v12 retrieval and evaluation tests
        run: python -m unittest tests/test_agency_codebase_context.py tests/test_agency_ragas_eval.py tests/test_agency_graph_retrieval.py -v
