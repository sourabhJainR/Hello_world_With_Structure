name: Repository Construct Traceability Check

on:
  pull_request:
    paths:
      - '.ai-harness/runtime/**'
      - '.ai-harness/project_profile.py'
      - '.ai-harness/tests/**'
      - '.ai-harness/config.toml'
      - '.ai-harness/*.md'
      - '.github/workflows/**'
  push:
    paths:
      - '.ai-harness/runtime/**'
      - '.ai-harness/project_profile.py'
      - '.ai-harness/tests/**'
      - '.ai-harness/config.toml'
      - '.ai-harness/*.md'
      - '.github/workflows/**'

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile traceability implementations
        run: python -m compileall -q .ai-harness
      - name: Validate construct index behavior
        run: |
          python - <<'PY'
          import pathlib
          import unittest

          suite = unittest.defaultTestLoader.discover(
              start_dir='.ai-harness/tests',
              pattern='test_construct_index.py',
          )
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit('No construct-index tests were collected')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f'Collected and passed {count} construct-index tests')
          PY
      - name: Validate harness configuration and version consistency
        run: python scripts/validate_plugin.py
      - name: Validate configuration feature flags
        run: |
          python - <<'PY'
          import tomllib
          c = tomllib.load(open('.ai-harness/config.toml', 'rb'))
          assert isinstance(c['harness']['version'], int) and c['harness']['version'] > 0
          assert c['construct_traceability']['enabled'] is True
          assert c['compatibility']['enabled'] is True
          assert c['learning']['feed_history_into_context'] is True
          assert c['collaborative_development']['enabled'] is True
          print(f"Harness version: {c['harness']['version']}")
          PY
