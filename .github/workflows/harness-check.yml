name: AI Harness Check

on:
  push:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/**'
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/**'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python harness
        run: python -m unittest discover -s tests -v
      - name: Compile harness, extensions and installer
        run: python -m py_compile .ai-harness/run.py .ai-harness/engine.py .ai-harness/context_engine.py .ai-harness/knowledge_fabric.py .ai-harness/extension_registry.py .ai-harness/provider.py .ai-harness/observability.py .ai-harness/project_profile.py .ai-harness/placement.py .ai-harness/worktree.py .ai-harness/review_agents.py scripts/install_skill.py
      - name: Validate configuration
        run: python -c "import tomllib; tomllib.load(open('.ai-harness/config.toml','rb')); tomllib.load(open('.ai-harness/extension_registry.toml','rb'))"
      - name: Validate deployable skill
        run: python -c "from pathlib import Path; p=Path('skills/ai-coding-orchestrator/SKILL.md'); assert p.exists() and 'Optional extension orchestration' in p.read_text(encoding='utf-8')"
      - name: Validate plugin manifest
        run: python -c "import json; p=json.load(open('.claude-plugin/plugin.json')); assert p['name']=='ai-coding-orchestrator' and p['skills']=='./skills/'"
      - name: Validate Flash-context policy
        run: python -c "from pathlib import Path; p=Path('.ai-harness/FLASH_CONTEXT_POLICY.md'); assert p.exists() and 'FlashAttention' in p.read_text(encoding='utf-8')"
      - name: Validate knowledge fabric policy
        run: python -c "from pathlib import Path; p=Path('.ai-harness/KNOWLEDGE_FABRIC_POLICY.md'); assert p.exists() and 'Graphify' in p.read_text(encoding='utf-8') and 'codebase-memory-mcp' in p.read_text(encoding='utf-8')"
      - name: Detect optional extensions
        run: python .ai-harness/extension_registry.py
      - name: Run routing regression evaluation
        run: python .ai-harness/run.py eval
      - name: Check convention profile
        run: python .ai-harness/project_profile.py
      - name: Check placement analyzer
        run: python .ai-harness/placement.py ExampleService.py ExampleConstants.py ExampleHandler.py
      - name: Check worktree helper
        run: python .ai-harness/worktree.py list
