name: AI Harness Check

on:
  push:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/**'
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/**'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python harness
        run: python -m unittest discover -s tests -v
      - name: Compile harness and extensions
        run: python -m py_compile .ai-harness/run.py .ai-harness/provider.py .ai-harness/observability.py .ai-harness/project_profile.py .ai-harness/placement.py .ai-harness/worktree.py .ai-harness/review_agents.py
      - name: Validate configuration
        run: python -c "import tomllib; tomllib.load(open('.ai-harness/config.toml','rb'))"
      - name: Run routing regression evaluation
        run: python .ai-harness/run.py eval
      - name: Check convention profile
        run: python .ai-harness/project_profile.py
      - name: Check placement analyzer
        run: python .ai-harness/placement.py ExampleService.py ExampleConstants.py ExampleHandler.py
      - name: Check worktree helper
        run: python .ai-harness/worktree.py list
