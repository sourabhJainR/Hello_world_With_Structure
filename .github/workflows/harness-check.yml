name: AI Harness Check

on:
  push:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/test_ai_harness.py'
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'tests/test_ai_harness.py'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python harness
        run: python -m unittest discover -s tests -p 'test_ai_harness.py' -v
      - name: Compile harness and provider bridge
        run: python -m py_compile .ai-harness/run.py .ai-harness/provider.py
      - name: Validate configuration
        run: python -c "import tomllib; tomllib.load(open('.ai-harness/config.toml','rb'))"
