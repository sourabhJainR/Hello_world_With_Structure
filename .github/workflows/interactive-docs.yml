name: Interactive Documentation

on:
  pull_request:
    paths:
      - 'docs/html/**'
      - 'scripts/validate_interactive_docs.py'
      - 'tests/test_interactive_docs.py'
  push:
    branches: [main]
    paths:
      - 'docs/html/**'
      - 'scripts/validate_interactive_docs.py'
      - 'tests/test_interactive_docs.py'

jobs:
  validate-interactive-docs:
    name: interactive-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate self-contained HTML
        run: python scripts/validate_interactive_docs.py
      - name: Run documentation regression test
        run: python -m unittest tests.test_interactive_docs -v
