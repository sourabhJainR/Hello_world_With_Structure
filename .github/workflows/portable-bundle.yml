name: AER Portable Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/skills/ai-coding-orchestrator/**'
      - '.claude-plugin/**'
      - '.claude/skills/ai-coding-orchestrator/**'
      - 'skills/ai-coding-orchestrator/**'
      - 'skills/engineering/**'
      - 'portable/**'
      - 'state/execution-envelope.schema.json'
      - 'aer_cli.py'
      - 'tests/test_portable_aer.py'
      - 'tests/test_task_planner.py'
      - 'tests/test_impact_analysis.py'
      - 'tests/test_bidirectional_install.py'
      - 'tests/test_contract_alignment.py'
      - 'tests/test_graph_agent_team.py'
      - 'tests/test_engineering_design_guard.py'
      - 'tests/test_execution_contract.py'
      - 'tests/test_repository_model_consolidation.py'
      - '.github/workflows/portable-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run portable bundle tests
        run: |
          PYTHONPATH=.:.ai-harness python -m unittest \
            tests.test_portable_aer \
            tests.test_task_planner \
            tests.test_impact_analysis \
            tests.test_bidirectional_install \
            tests.test_contract_alignment \
            tests.test_graph_agent_team \
            tests.test_engineering_design_guard \
            tests.test_execution_contract \
            tests.test_repository_model_consolidation -v
      - name: Read AER version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build canonical portable bundle
        run: python aer_cli.py build --output aer-portable.zip
      - name: Verify canonical portable bundle
        run: python aer_cli.py verify aer-portable.zip
      - name: Verify canonical payload and version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import zipfile
          with zipfile.ZipFile('aer-portable.zip') as z:
              names = set(z.namelist())
              required = {
                  'aer_cli.py',
                  'aer-bundle.json',
                  'payload/.claude-plugin/plugin.json',
                  'payload/.claude-plugin/marketplace.json',
                  'payload/skills/ai-coding-orchestrator/SKILL.md',
                  'payload/skills/ai-coding-orchestrator/hooks/aer_prompt.py',
                  'payload/.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing canonical AER payload: ' + ', '.join(missing))
              expected = os.environ['EXPECTED_VERSION']
              plugin = json.loads(z.read('payload/.claude-plugin/plugin.json'))
              manifest = json.loads(z.read('aer-bundle.json'))
              if plugin.get('version') != expected:
                  raise SystemExit(f"plugin version mismatch: {plugin.get('version')} != {expected}")
              if manifest.get('version') != expected:
                  raise SystemExit(f"bundle version mismatch: {manifest.get('version')} != {expected}")
              recorded = {item['path'] for item in manifest['files']}
              for path in ('aer_cli.py', '.claude-plugin/plugin.json', '.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'):
                  if path not in recorded:
                      raise SystemExit(f'{path} is not integrity-covered')
              contract = json.loads(z.read('payload/.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'))
              if contract.get('downgrade') != 'explicit_install_only':
                  raise SystemExit('artifact downgrade policy changed unexpectedly')
              if contract.get('automatic_update_downgrade') != 'forbidden':
                  raise SystemExit('automatic downgrade policy changed unexpectedly')
          print(f'Canonical AER portable bundle verified: {expected}')
          PY
      - name: Smoke-test single-file distribution
        run: python aer_cli.py verify aer-portable.zip
      - name: Publish single AER distribution
        uses: actions/upload-artifact@v7
        with:
          name: aer-portable
          path: aer-portable.zip
          if-no-files-found: error
          retention-days: '30'
