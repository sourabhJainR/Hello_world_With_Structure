name: AER Portable Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/skills/ai-coding-orchestrator/**'
      - '.claude-plugin/**'
      - '.claude/skills/ai-coding-orchestrator/**'
      - 'skills/ai-coding-orchestrator/**'
      - 'portable/**'
      - 'aer_cli.py'
      - 'tests/test_portable_aer.py'
      - 'tests/test_task_planner.py'
      - 'tests/test_impact_analysis.py'
      - 'tests/test_bidirectional_install.py'
      - 'tests/test_contract_alignment.py'
      - 'tests/test_graph_agent_team.py'
      - 'tests/test_engineering_design_guard.py'
      - '.github/workflows/portable-bundle.yml'
      - '.github/actions/publish-ci-artifacts/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare CI artifacts
        run: |
          rm -rf ci-artifacts dist/aer-portable
          mkdir -p ci-artifacts dist/aer-portable
      - name: Run portable bundle tests
        run: |
          set -o pipefail
          PYTHONPATH=.:.ai-harness python -m unittest tests.test_portable_aer tests.test_task_planner tests.test_impact_analysis tests.test_bidirectional_install tests.test_contract_alignment tests.test_graph_agent_team tests.test_engineering_design_guard -v 2>&1 | tee ci-artifacts/portable-tests.log
      - name: Build bundle
        run: python aer_cli.py build --output aer-portable.zip
      - name: Verify bundle
        run: python aer_cli.py verify aer-portable.zip
      - name: Verify Claude plugin payload
        run: |
          python - <<'PY'
          import json
          import zipfile
          with zipfile.ZipFile('aer-portable.zip') as z:
              names = set(z.namelist())
              required = {
                  'payload/.claude-plugin/plugin.json',
                  'payload/.claude-plugin/marketplace.json',
                  'payload/skills/ai-coding-orchestrator/SKILL.md',
                  'payload/skills/ai-coding-orchestrator/hooks/aer_prompt.py',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing Claude integration payload: ' + ', '.join(missing))
              plugin = json.loads(z.read('payload/.claude-plugin/plugin.json'))
              assert plugin['version'] == '21.0.0', plugin
              assert 'UserPromptSubmit' in plugin['hooks'], plugin
              contract = json.loads(z.read('payload/.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'))
              assert contract['downgrade'] == 'explicit_install_only', contract
              assert contract['automatic_update_downgrade'] == 'forbidden', contract
              manifest = json.loads(z.read('aer-bundle.json'))
              recorded = {item['path'] for item in manifest['files']}
              assert '.claude-plugin/plugin.json' in recorded, 'plugin manifest is not integrity-covered'
              assert '.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json' in recorded, 'artifact policy is not integrity-covered'
              assert 'aer_cli.py' in recorded, 'launcher is not integrity-covered'
          print('Claude integration, artifact policy and launcher are payloaded and integrity-covered')
          PY
      - name: Assemble extracted distribution for validation
        run: |
          rm -rf dist/aer-portable dist/aer-portable-staging
          mkdir -p dist/aer-portable dist/aer-portable-staging
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          bundle = Path('aer-portable.zip')
          staging = Path('dist/aer-portable-staging')
          destination = Path('dist/aer-portable')
          with zipfile.ZipFile(bundle) as z:
              z.extractall(staging)
          payload = staging / 'payload'
          for name in ('.ai-harness', 'portable', 'skills', '.claude-plugin', '.claude'):
              source = payload / name
              if source.exists():
                  shutil.copytree(source, destination / name, dirs_exist_ok=True)
          for name in ('aer_cli.py', 'aer-bundle.json'):
              source = staging / name
              if source.is_file():
                  shutil.copy2(source, destination / name)
          required = (
              destination / 'aer-bundle.json',
              destination / 'aer_cli.py',
              destination / 'portable' / 'aer_runtime.py',
              destination / 'portable' / 'orchestration.py',
          )
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing extracted distribution files: ' + ', '.join(missing))
          shutil.rmtree(staging, ignore_errors=True)
          print('Extracted AER distribution validated')
          PY
      - name: Smoke-test embedded launcher
        run: |
          rm -rf /tmp/aer-embedded-smoke
          mkdir -p /tmp/aer-embedded-smoke
          cd /tmp/aer-embedded-smoke
          python "$GITHUB_WORKSPACE/aer_cli.py" verify "$GITHUB_WORKSPACE/aer-portable.zip" > "$GITHUB_WORKSPACE/ci-artifacts/embedded-cli-smoke.log"
          grep -q '"portable": true' "$GITHUB_WORKSPACE/ci-artifacts/embedded-cli-smoke.log"
      - name: Stage unified portable artifact
        if: always()
        run: |
          rm -rf ci-artifacts/publish
          mkdir -p ci-artifacts/publish
          if [ -f aer-portable.zip ]; then cp aer-portable.zip ci-artifacts/publish/aer-portable.zip; fi
          cat > ci-artifacts/publish/README.txt <<'EOF'
AER Portable Distribution

Download aer-portable.zip. It is the single distributable artifact.

The ZIP contains the AER launcher, runtime, skills, plugin metadata, and integrity manifest.

Use:
  python aer_cli.py aer-portable.zip

Or extract the ZIP and run:
  python aer_cli.py install
EOF
      - name: Verify unified artifact layout
        if: always()
        run: |
          test -f ci-artifacts/publish/aer-portable.zip
          test ! -f ci-artifacts/publish/aer_cli.py
          test ! -f ci-artifacts/aer-portable.zip
          test ! -f ci-artifacts/aer_cli.py
          python - <<'PY'
          from pathlib import Path
          import zipfile
          artifact = Path('ci-artifacts/publish/aer-portable.zip')
          with zipfile.ZipFile(artifact) as archive:
              names = {name.rstrip('/') for name in archive.namelist()}
          required = {'aer-bundle.json', 'aer_cli.py', 'payload/portable/aer_runtime.py'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit('unified AER artifact is missing: ' + ', '.join(missing))
          print('Unified artifact verified: one aer-portable.zip containing launcher + runtime + manifest')
          PY
      - name: Collect CI metadata
        if: always()
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'ref=%s\n' "$GITHUB_REF"
          } > ci-artifacts/publish/run-metadata.txt
      - name: Publish unified AER artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aer-portable
          path: ci-artifacts/publish/
          if-no-files-found: error
          retention-days: '30'
          include-hidden-files: true
