name: AER Portable Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.ai-harness/**'
      - 'skills/ai-coding-orchestrator/**'
      - 'portable/**'
      - 'aer_cli.py'
      - 'tests/test_portable_aer.py'
      - '.github/workflows/portable-bundle.yml'
      - '.github/actions/publish-ci-artifacts/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare CI artifacts
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
      - name: Run portable bundle tests
        run: |
          set -o pipefail
          python -m unittest tests.test_portable_aer -v 2>&1 | tee ci-artifacts/portable-tests.log
      - name: Build bundle
        run: python aer_cli.py build --output aer-portable.zip
      - name: Verify bundle
        run: python aer_cli.py verify aer-portable.zip
      - name: Stage portable bundle
        if: always()
        run: |
          if [ -f aer-portable.zip ]; then cp aer-portable.zip ci-artifacts/aer-portable.zip; fi
      - name: Collect CI metadata
        if: always()
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'ref=%s\n' "$GITHUB_REF"
          } > ci-artifacts/run-metadata.txt
      - name: Publish CI artifacts
        if: always()
        uses: ./.github/actions/publish-ci-artifacts
        with:
          artifact-name: aer-portable
          path: ci-artifacts/
          retention-days: '30'
