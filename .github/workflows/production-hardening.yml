name: Production AI Harness Hardening

on:
  pull_request:
    paths:
      - '.ai-harness/**'
      - 'state/**'
      - 'tests/**'
      - '.github/workflows/production-hardening.yml'
  push:
    branches: [main]
    paths:
      - '.ai-harness/**'
      - 'state/**'
      - 'tests/**'
      - '.github/workflows/production-hardening.yml'

jobs:
  hardening:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile security and ledger components
        run: python -m py_compile .ai-harness/security_gate.py .ai-harness/safe_provider.py .ai-harness/state_validator.py .ai-harness/provider.py
      - name: Run focused hardening tests
        run: python -m unittest tests.test_security_gate tests.test_state_validator tests.test_provider -v
      - name: Validate configuration
        run: python -c "import tomllib; c=tomllib.load(open('.ai-harness/config.toml','rb')); assert c['harness']['version'] >= 21; assert c['durability']['journal_failure_is_non_fatal'] is False; assert c['reviewers']['require_consensus_for_high_risk'] is True"
      - name: Validate ledger schema and implementation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.ai-harness')
          from state_validator import validate_state
          schema = json.loads(Path('state/engineering-state.schema.json').read_text())
          assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
          sample = {
              'schema_version':'1.0','task_id':'ci','status':'investigating',
              'intent':{'goal':'ci'},
              'contract':{'requirements':[],'acceptance':[],'protected_behavior':[]},
              'repo_facts':[],'decisions':[],'evidence':[],'changeset':{},
              'verification':[],'outcome':{'status':'unknown'},'open_risks':[],'next':[]
          }
          assert validate_state(sample) == []
          PY
