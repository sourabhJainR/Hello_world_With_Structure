name: Plugin Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package
        run: |
          python scripts/validate_plugin.py
          python -m py_compile scripts/install_skill.py scripts/validate_plugin.py
          python -m unittest discover -s tests -v
      - name: Validate tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version']
          tag = os.environ['TAG']
          expected = f'v{version}'
          if tag != expected:
              raise SystemExit(f'tag {tag} does not match plugin version {expected}')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
